name: Lint do Ren'Py

on:
  pull_request:
  push:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache do Ren'Py SDK
        id: cache-renpy
        uses: actions/cache@v4
        with:
          path: renpy-sdk
          key: renpy-sdk-8.5.3

      - name: Baixar Ren'Py SDK
        if: steps.cache-renpy.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o renpy.tar.bz2 https://www.renpy.org/dl/8.5.3/renpy-8.5.3-sdk.tar.bz2
          mkdir renpy-sdk
          tar -xjf renpy.tar.bz2 -C renpy-sdk --strip-components=1
          rm renpy.tar.bz2  # senão o tarball (~150 MB) entra nos pacotes do jogo

      - name: Rodar lint
        # O lint do Ren'Py sai com código 0 mesmo quando acha problemas; cada
        # problema vem numa linha "game/arquivo.rpy:N ...", então o passo
        # falha se aparecer alguma.
        run: |
          ./renpy-sdk/renpy.sh . lint 2>&1 | tee lint.txt
          if grep -E '^game/.+\.rpy:[0-9]+' lint.txt; then
            echo "::error::O lint do Ren'Py encontrou problemas (linhas acima)."
            exit 1
          fi

      - name: Conferir tabelas de decisões (roteiro × jogo)
        run: |
          python3 scripts/simular_historia.py renato
          python3 scripts/testar_logica.py renato
